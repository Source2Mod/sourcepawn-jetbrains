name: Build Plugin

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:

  version:
    name: Resolve version
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      build: ${{ steps.resolve.outputs.build }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Decide what to build
        id: resolve
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # Tag push: release that tag
          case "$GITHUB_REF" in
            refs/tags/*)
              echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
              echo "build=true" >> "$GITHUB_OUTPUT"
              echo "Releasing pushed tag ${GITHUB_REF#refs/tags/}."
              exit 0
              ;;
          esac

          # Manual run: build without release
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Manual run -- building without a release."
            exit 0
          fi

          # Only pushbuild.txt touches trigger release
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ -n "${BEFORE:-}" ] && git rev-parse -q --verify "$BEFORE^{commit}" >/dev/null; then
              changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
            else
              changed="$(git show --pretty= --name-only "$GITHUB_SHA")"
            fi

            if ! printf '%s\n' "$changed" | grep -qx 'pushbuild.txt'; then
              echo "pushbuild.txt untouched -- nothing to build."
              exit 0
            fi
          fi

          # Find latest v0.X.Y and increment
          latest="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            # Increment patch version
            major="${latest%%.*}"
            minor="${latest#*.}"
            minor="${minor%.*}"
            patch="${latest##*.}"
            next="${major}.${minor}.$((patch + 1))"
          fi

          # Paranoia: never reuse a tag
          while git rev-parse -q --verify "refs/tags/$next" >/dev/null; do
            next="${major}.${minor}.$((patch + 1))"
            patch=$((patch + 1))
          done

          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "Cutting $next."

      - name: Create the tag
        if: steps.resolve.outputs.tag != '' && !startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"


  build:
    name: Build Plugin
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, verify and publish plugin
        env:
          TAG: ${{ needs.version.outputs.tag }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          # Release builds take their version from the tag (v1.2.3 -> 1.2.3; on a tag push
          # build.gradle.kts reads GITHUB_REF_NAME, a pushbuild.txt run passes the new tag),
          # plain builds keep pluginVersion from gradle.properties.
          # verifyPlugin fails on compatibility problems / internal API, so nothing broken gets published.
          if [ -n "$TAG" ]; then
            ./gradlew buildPlugin verifyPlugin publishPlugin -PpluginVersion="${TAG#v}"
          else
            ./gradlew buildPlugin verifyPlugin
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-distribution
          path: build/distributions/sourcepawn-jetbrains-*.zip
          if-no-files-found: error


  release:
    name: Release
    if: needs.version.outputs.tag != ''
    needs:
      - version
      - build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-distribution
          path: ./release/files

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: release/files/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
