pluginGroup = org.source2mod.sourcepawn
pluginVersion = 0.1.0
# First IDE build the plugin supports: 2024.3 (CLion 2024.3.x, build 243)
pluginSinceBuild = 243

# IDE the plugin is compiled against and runIde starts.
platformType = CL
platformVersion = 2024.3.2
# Set to an installed IDE to skip the ~1 GB download, e.g.
#   platformLocalPath=C:/Program Files/JetBrains/CLion 2024.3.2
# (gradle.properties in ~/.gradle or -PplatformLocalPath=... on the command line)
platformLocalPath =

kotlin.stdlib.default.dependency = false
org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.jvmargs = -Xmx2g
